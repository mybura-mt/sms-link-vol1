<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>社内報 LINK Vol.1 JUNE | SMS GROUP</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg1: #06101e;
  --bg2: #0d2040;
  --accent: #4d9fec;
  --text: #dde6f4;
  --muted: rgba(221,230,244,0.38);
}

body {
  background: linear-gradient(150deg, var(--bg1) 0%, var(--bg2) 100%);
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: -apple-system, 'Hiragino Kaku Gothic Pro', 'Noto Sans JP', sans-serif;
  color: var(--text);
  padding: 12px 8px;
  gap: 10px;
  user-select: none;
  overflow-x: hidden;
}

/* ── Header ── */
.hdr { text-align: center; }
.hdr-title {
  font-size: clamp(13px, 4vw, 20px);
  font-weight: 700;
  letter-spacing: clamp(2px, 1vw, 5px);
  color: #cdd8f4;
}
.hdr-sub {
  font-size: clamp(9px, 2.5vw, 11px);
  letter-spacing: 1px;
  color: var(--muted);
  margin-top: 3px;
}

/* ── Loading ── */
#loading { text-align: center; padding: 0 16px; }
.l-msg { font-size: 13px; color: var(--muted); }
.progress-track {
  width: min(240px, 80vw); height: 2px;
  background: rgba(255,255,255,0.1);
  border-radius: 1px;
  margin: 14px auto;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), #7dd3fc);
  border-radius: 1px;
  width: 0%;
  transition: width 0.35s ease;
}

/* ── Error / Manual load ── */
#err-box { display: none; text-align: center; max-width: 360px; padding: 0 16px; }
.err-msg { font-size: 13px; color: #f38ba8; margin-bottom: 14px; }
.file-label {
  display: inline-block;
  padding: 10px 24px;
  background: var(--accent);
  color: #fff;
  border-radius: 100px;
  cursor: pointer;
  font-size: 13px;
  transition: opacity .2s;
}
.file-label:hover { opacity: .85; }
#file-in { display: none; }

/* ── Viewer ── */
#viewer { display: none; flex-direction: column; align-items: center; gap: 10px; width: 100%; }

/* book-wrap: position:relative は JS で設定 */
#book-wrap {
  filter: drop-shadow(0 12px 30px rgba(0,0,0,.7))
          drop-shadow(0 3px 8px rgba(0,0,0,.5));
  flex-shrink: 0;
}
#flipbook canvas { display: block; }

/* ── Top info row ── */
.info-row {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  justify-content: center;
}

/* ── Controls ── */
.controls {
  display: flex;
  align-items: center;
  gap: 8px;
  justify-content: center;
  width: 100%;
  flex-wrap: nowrap;
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 10px 16px;
  min-height: 44px;
  background: rgba(255,255,255,.08);
  color: rgba(255,255,255,.85);
  border: 1px solid rgba(255,255,255,.15);
  border-radius: 100px;
  cursor: pointer;
  font-size: clamp(11px, 3vw, 13px);
  font-family: inherit;
  transition: background .18s, border-color .18s, opacity .18s;
  white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
}
.btn:hover:not(:disabled),
.btn:active:not(:disabled) {
  background: rgba(255,255,255,.16);
  border-color: rgba(255,255,255,.3);
}
.btn:disabled { opacity: .22; cursor: default; }
.btn-edge { display: inline-flex; }
.btn-zoom {
  background: rgba(77,159,236,.2);
  border-color: rgba(77,159,236,.4);
}
.btn-zoom:hover { background: rgba(77,159,236,.35) !important; }

.counter {
  font-size: clamp(11px, 3vw, 13px);
  color: var(--muted);
  min-width: 52px;
  text-align: center;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

/* ── Dot navigation ── */
#dots-wrap {
  width: 100%;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  padding: 4px 0;
}
#dots-wrap::-webkit-scrollbar { display: none; }
#dots {
  display: flex;
  gap: 6px;
  align-items: center;
  justify-content: flex-start;
  min-width: max-content;
  padding: 0 8px;
}
.dot {
  width: 30px; height: 30px;
  min-width: 30px;
  border: 1px solid rgba(255,255,255,.2);
  border-radius: 50%;
  background: rgba(255,255,255,.06);
  color: rgba(255,255,255,.5);
  font-size: 10px;
  cursor: pointer;
  transition: background .18s, border-color .18s, color .18s;
  font-family: inherit;
  display: flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent;
  flex-shrink: 0;
}
.dot:hover,
.dot:active { background: rgba(255,255,255,.14); color: rgba(255,255,255,.85); }
.dot.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

.hint {
  font-size: 10px;
  color: rgba(255,255,255,.18);
  letter-spacing: .5px;
  text-align: center;
}

/* ── Page type badge ── */
#page-badge {
  font-size: 10px;
  padding: 3px 10px;
  border-radius: 100px;
  border: 1px solid rgba(255,255,255,.15);
  color: var(--muted);
  letter-spacing: 1px;
  white-space: nowrap;
}

/* ── ズームモーダル ── */
#zoom-modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.96);
  z-index: 9999;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  touch-action: none;
}
#zoom-modal.open { display: flex; }

#zoom-stage {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  touch-action: none;
}

#zoom-img {
  max-width: none;
  max-height: none;
  display: block;
  transform-origin: center center;
  will-change: transform;
  touch-action: none;
  pointer-events: none;
  transition: none;
}

#zoom-toolbar {
  position: absolute;
  top: 12px;
  right: 12px;
  display: flex;
  gap: 8px;
  z-index: 10;
}

.zoom-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 44px; height: 44px;
  background: rgba(255,255,255,.12);
  border: 1px solid rgba(255,255,255,.25);
  border-radius: 50%;
  color: #fff;
  font-size: 18px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  backdrop-filter: blur(4px);
}
.zoom-btn:active { background: rgba(255,255,255,.28); }

#zoom-hint {
  position: absolute;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 11px;
  color: rgba(255,255,255,.35);
  letter-spacing: .5px;
  pointer-events: none;
  white-space: nowrap;
}

#zoom-nav {
  position: absolute;
  bottom: 44px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 12px;
  z-index: 10;
}

.zoom-nav-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 8px 20px;
  min-height: 40px;
  background: rgba(255,255,255,.1);
  border: 1px solid rgba(255,255,255,.2);
  border-radius: 100px;
  color: rgba(255,255,255,.8);
  font-size: 13px;
  cursor: pointer;
  font-family: inherit;
  -webkit-tap-highlight-color: transparent;
  backdrop-filter: blur(4px);
  white-space: nowrap;
}
.zoom-nav-btn:active { background: rgba(255,255,255,.22); }
.zoom-nav-btn:disabled { opacity: .22; }

/* ── モバイル調整 ── */
@media (max-width: 600px) {
  body { padding: 8px 4px; gap: 8px; }
  .hdr-sub { display: none; }
  .btn-edge { display: none; }
  .hint { display: none; }
  .controls { gap: 6px; }
  .btn { padding: 10px 14px; }
}
</style>
</head>
<body>

<div class="hdr">
  <p class="hdr-title">社内報 LINK &thinsp; Vol.1 &thinsp; JUNE</p>
  <p class="hdr-sub">SMS GROUP &mdash; グループみんなで、未来を面白くしていこう</p>
</div>

<!-- Loading -->
<div id="loading">
  <p class="l-msg" id="l-msg">社内報を読み込んでいます...</p>
  <div class="progress-track"><div class="progress-fill" id="pbar"></div></div>
  <p style="font-size:11px;color:rgba(255,255,255,.22);margin-top:4px" id="l-sub"></p>
</div>

<!-- Error / Manual -->
<div id="err-box">
  <p class="err-msg" id="err-msg">PDFの自動読み込みに失敗しました。ファイルを選択してください。</p>
  <label class="file-label">
    PDFファイルを選択
    <input type="file" id="file-in" accept="application/pdf">
  </label>
</div>

<!-- Viewer -->
<div id="viewer">
  <div class="info-row">
    <span id="page-badge">表紙</span>
    <span class="counter" id="counter">1 / 1</span>
  </div>

  <div id="book-wrap">
    <div id="flipbook"></div>
  </div>

  <div class="controls">
    <button class="btn btn-edge" id="btn-first">|◀ 表紙</button>
    <button class="btn" id="btn-prev">◀ 前へ</button>
    <button class="btn btn-zoom" id="btn-zoom">&#x1F50D; 拡大</button>
    <button class="btn" id="btn-next">次へ ▶</button>
    <button class="btn btn-edge" id="btn-last">最後 ▶|</button>
  </div>

  <div id="dots-wrap"><div id="dots"></div></div>

  <p class="hint">← → キー または ページ端のドラッグでもめくれます</p>
</div>

<!-- ズームモーダル -->
<div id="zoom-modal">
  <div id="zoom-stage">
    <img id="zoom-img" src="" alt="">
  </div>
  <div id="zoom-toolbar">
    <button class="zoom-btn" id="zoom-in"  title="拡大">+</button>
    <button class="zoom-btn" id="zoom-out" title="縮小">−</button>
    <button class="zoom-btn" id="zoom-close" title="閉じる">&#x2715;</button>
  </div>
  <div id="zoom-nav">
    <button class="zoom-nav-btn" id="znav-prev">◀ 前へ</button>
    <span style="display:inline-flex;align-items:center;font-size:12px;color:rgba(255,255,255,.5)" id="znav-counter"></span>
    <button class="zoom-nav-btn" id="znav-next">次へ ▶</button>
  </div>
  <p id="zoom-hint">ピンチで拡大 &nbsp;／&nbsp; ダブルタップでリセット</p>
</div>

<!-- PDF.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<!-- StPageFlip -->
<script src="https://unpkg.com/page-flip/dist/js/page-flip.browser.js"></script>

<script>
'use strict';

pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const PDF_NAME = '社内報（創刊号A4）.pdf';

// 全ページ A4 縦のため PORTRAIT_SLOTS / SKIP_SLOTS は空
const PORTRAIT_SLOTS = new Set([]);
const SKIP_SLOTS     = new Set([]);

const $ = id => document.getElementById(id);
const pbar = $('pbar');
const lMsg = $('l-msg');

let pf;
let totalImgs;   // 全スロット数（StPageFlip に渡す画像数）
let totalViews;  // ユーザーが見る「ページ（見開き・単ページ）」数
let allImgs = []; // ズームモーダル用に全ページ画像を保持


/* ═══════════════════════════════════════
   PDF を読み込んで画像配列を作成する
   ─────────────────────────────────────
   【解像度戦略】
   ・renderScale = 高解像度でPDFを描画（3x 前後）
   ・displayScale = 画面に収まるCSSサイズ
   ・cssFactor = renderScale → displayScale への縮小率
   CSS transform scale(cssFactor) で大きなCanvasを
   縮小表示することで文字のシャープさを確保する
═══════════════════════════════════════ */
async function renderPDF(src) {
  const loadArg = src instanceof ArrayBuffer ? { data: src } : src;
  const pdf = await pdfjsLib.getDocument(loadArg).promise;
  const numPages = pdf.numPages;

  const p1 = await pdf.getPage(1);
  const vp1nat = p1.getViewport({ scale: 1 });

  // ── スクリーンサイズ判定 ──
  const isMobile = window.innerWidth < 640;
  const vPad = isMobile ? 160 : 210;
  const maxH = Math.min(window.innerHeight - vPad, 680);
  const maxW = window.innerWidth - (isMobile ? 8 : 24);

  // ── displayScale 計算 ──
  // スマホ: A4縦1枚が画面幅に収まるスケール（A3を分割して1枚ずつ表示するため）
  // PC    : A3横（A4×2）が画面幅に収まるスケール
  const displayScale = Math.min(
    maxH / vp1nat.height,
    isMobile ? maxW / vp1nat.width : maxW / (vp1nat.width * 2),
    1.0
  );

  // ── 高解像度レンダリング ──
  const dpr = window.devicePixelRatio || 1;
  const qualityFactor = Math.min(dpr * 2.5, 3.5);
  const renderScale = displayScale * qualityFactor;

  // A4縦1枚の物理ピクセルサイズ
  const singleW = Math.round(vp1nat.width  * renderScale);
  const singleH = Math.round(vp1nat.height * renderScale);

  // 出力キャンバス幅（スマホ=A4幅、PC=A3幅）
  const spreadW = isMobile ? singleW : singleW * 2;
  const spreadH = singleH;

  // CSS transform 縮小率
  const cssFactor = displayScale / renderScale;

  // 背景色（PC で A4縦ページを A3 幅に配置する際に使用）
  const PORT_BG = '#0d2040';

  const imgs = [];
  let rawSlot = 0;

  function pushSlot(dataURL) {
    rawSlot++;
    if (!SKIP_SLOTS.has(rawSlot)) imgs.push(dataURL);
  }

  // ── 全PDFページを処理 ──
  for (let i = 1; i <= numPages; i++) {
    lMsg.textContent = `ページ ${i} / ${numPages} を処理中...`;
    pbar.style.width = (5 + (i / numPages) * 90) + '%';

    const page   = await pdf.getPage(i);
    const vpNat  = page.getViewport({ scale: 1 });
    const isPort = vpNat.height > vpNat.width * 1.1;  // 縦長 = A4縦

    const vp = page.getViewport({ scale: renderScale });
    const pageCv = document.createElement('canvas');
    pageCv.width  = Math.round(vp.width);
    pageCv.height = Math.round(vp.height);
    await page.render({ canvasContext: pageCv.getContext('2d'), viewport: vp }).promise;

    if (isMobile) {
      // ── スマホ: 1ページずつ表示 ──
      if (isPort) {
        // A4縦 → そのまま1ビュー（画面幅いっぱい）
        const out = document.createElement('canvas');
        out.width = singleW; out.height = singleH;
        out.getContext('2d').drawImage(pageCv, 0, 0, singleW, singleH);
        pushSlot(out.toDataURL('image/jpeg', 0.95));
      } else {
        // A3横 → 左右に分割して2ビュー（各A4縦サイズ）
        const half = Math.round(pageCv.width / 2);

        const lc = document.createElement('canvas');
        lc.width = singleW; lc.height = singleH;
        lc.getContext('2d').drawImage(pageCv, 0, 0, half, pageCv.height, 0, 0, singleW, singleH);
        pushSlot(lc.toDataURL('image/jpeg', 0.95));

        const rc = document.createElement('canvas');
        rc.width = singleW; rc.height = singleH;
        rc.getContext('2d').drawImage(pageCv, half, 0, pageCv.width - half, pageCv.height, 0, 0, singleW, singleH);
        pushSlot(rc.toDataURL('image/jpeg', 0.95));
      }
    } else {
      // ── PC: 1PDFページ = 1ビュー（A3全幅）──
      const out = document.createElement('canvas');
      out.width = spreadW; out.height = spreadH;
      const ctx = out.getContext('2d');

      if (isPort) {
        // A4縦 → A3幅の中央に配置（両脇に濃紺背景）
        ctx.fillStyle = PORT_BG;
        ctx.fillRect(0, 0, spreadW, spreadH);
        ctx.drawImage(pageCv, Math.round((spreadW - singleW) / 2), 0, singleW, spreadH);
      } else {
        // A3横 → 全幅に描画
        ctx.drawImage(pageCv, 0, 0, spreadW, spreadH);
      }
      pushSlot(out.toDataURL('image/jpeg', 0.95));
    }
  }

  pbar.style.width = '100%';

  totalImgs  = imgs.length;
  totalViews = totalImgs;
  allImgs    = imgs;

  return { imgs, spreadW, spreadH, cssFactor };
}

/* ═══════════════════════════════════════
   PageFlip ビューワーを構築する
═══════════════════════════════════════ */
async function buildViewer({ imgs, spreadW, spreadH, cssFactor }) {
  $('loading').style.display = 'none';
  $('err-box').style.display = 'none';
  $('viewer').style.display  = 'flex';

  // ── StPageFlip 初期化 ──
  // usePortrait: true = 1ページずつ表示（余白ページが発生しない）
  // width/height = 見開き幅（A3横）のサイズ
  pf = new St.PageFlip($('flipbook'), {
    width:               spreadW,
    height:              spreadH,
    showCover:           true,
    usePortrait:         true,   // 1ページ=1ビュー（ペアリングなし）
    autoSize:            false,
    mobileScrollSupport: false,
    flippingTime:        700,
    maxShadowOpacity:    0.45,
    drawShadow:          true,
  });

  pf.loadFromImages(imgs);

  // ── CSS transform で高解像度→表示サイズに縮小 ──
  const flipDiv  = $('flipbook');
  const bookWrap = $('book-wrap');

  const displayW = Math.round(spreadW * cssFactor);
  const displayH = Math.round(spreadH * cssFactor);

  flipDiv.style.position        = 'absolute';
  flipDiv.style.top             = '0';
  flipDiv.style.left            = '0';
  flipDiv.style.transformOrigin = 'top left';
  flipDiv.style.transform       = `scale(${cssFactor})`;

  bookWrap.style.position = 'relative';
  bookWrap.style.width    = displayW + 'px';
  bookWrap.style.height   = displayH + 'px';
  bookWrap.style.overflow = 'hidden';

  // ── バッジラベル（1ページ=1ビュー） ──
  function badge(idx) {
    if (idx === 0)              return '表紙';
    if (idx === totalImgs - 1)  return '最終ページ';
    return `${idx + 1} ページ`;
  }

  // ── UI 更新 ──
  function update() {
    const idx = pf.getCurrentPageIndex();
    $('counter').textContent    = `${idx + 1} / ${totalImgs}`;
    $('page-badge').textContent = badge(idx);
    $('btn-first').disabled = idx <= 0;
    $('btn-prev') .disabled = idx <= 0;
    $('btn-next') .disabled = idx >= totalImgs - 1;
    $('btn-last') .disabled = idx >= totalImgs - 1;
    $('dots').querySelectorAll('.dot').forEach((d, i) => {
      d.classList.toggle('active', i === idx);
    });
    // アクティブなドットをスクロールして見えるようにする
    const activeDot = $('dots').children[idx];
    if (activeDot) {
      const wrap = $('dots-wrap');
      const dotLeft = activeDot.offsetLeft;
      const dotW    = activeDot.offsetWidth;
      const wrapW   = wrap.offsetWidth;
      wrap.scrollTo({ left: dotLeft - wrapW / 2 + dotW / 2, behavior: 'smooth' });
    }
  }

  pf.on('flip',        update);
  pf.on('changeState', update);
  update();

  // ── ドットナビゲーション生成 ──
  const dotsEl = $('dots');
  for (let i = 0; i < totalImgs; i++) {
    const dot = document.createElement('button');
    dot.className = 'dot' + (i === 0 ? ' active' : '');
    dot.textContent = i + 1;
    dot.title = badge(i);
    dot.addEventListener('click', () => pf.flip(i));
    dotsEl.appendChild(dot);
  }

  // ── ボタン ──
  $('btn-first').addEventListener('click', () => pf.flip(0));
  $('btn-prev') .addEventListener('click', () => {
    const idx = pf.getCurrentPageIndex();
    if (idx > 0) pf.flipPrev();
  });
  $('btn-next') .addEventListener('click', () => {
    const idx = pf.getCurrentPageIndex();
    if (idx < totalImgs - 1) pf.flipNext();
  });
  $('btn-last') .addEventListener('click', () => pf.flip(totalImgs - 1));

  // ── キーボード ──
  document.addEventListener('keydown', e => {
    if ($('zoom-modal').classList.contains('open')) return;
    const idx = pf.getCurrentPageIndex();
    if (e.key === 'ArrowRight' && idx < totalImgs - 1) pf.flipNext();
    if (e.key === 'ArrowLeft'  && idx > 0)             pf.flipPrev();
    if (e.key === 'Home') pf.flip(0);
    if (e.key === 'End')  pf.flip(totalImgs - 1);
  });

  // ── ズームボタン ──
  $('btn-zoom').addEventListener('click', () => {
    openZoom(pf.getCurrentPageIndex());
  });
}

/* ═══════════════════════════════════════
   ズームモーダル
═══════════════════════════════════════ */
(function initZoom() {
  const modal    = $('zoom-modal');
  const stage    = $('zoom-stage');
  const img      = $('zoom-img');
  const btnClose = $('zoom-close');
  const btnIn    = $('zoom-in');
  const btnOut   = $('zoom-out');
  const znavPrev = $('znav-prev');
  const znavNext = $('znav-next');
  const znavCtr  = $('znav-counter');

  let zIdx   = 0;
  let zScale = 1;
  let zTx    = 0, zTy = 0;

  // ピンチ用
  let lastDist = 0;
  let pinchMidX = 0, pinchMidY = 0;
  // パン用
  let dragging = false;
  let dragSX = 0, dragSY = 0;
  // ダブルタップ用
  let lastTapTime = 0;

  function getTouchDist(t) {
    const dx = t[0].clientX - t[1].clientX;
    const dy = t[0].clientY - t[1].clientY;
    return Math.sqrt(dx * dx + dy * dy);
  }

  function applyTransform(animate) {
    img.style.transition = animate ? 'transform .25s ease' : 'none';
    img.style.transform  = `translate(${zTx}px,${zTy}px) scale(${zScale})`;
  }

  function clampPan() {
    // 画像がステージよりも小さい場合は中央に戻す
    const sw = stage.clientWidth;
    const sh = stage.clientHeight;
    const iw = img.naturalWidth  * zScale;
    const ih = img.naturalHeight * zScale;
    const maxTx = Math.max(0, (iw - sw) / 2);
    const maxTy = Math.max(0, (ih - sh) / 2);
    zTx = Math.max(-maxTx, Math.min(maxTx, zTx));
    zTy = Math.max(-maxTy, Math.min(maxTy, zTy));
  }

  function resetTransform(animate) {
    zScale = 1; zTx = 0; zTy = 0;
    applyTransform(animate);
  }

  function updateZoomNav() {
    znavCtr.textContent  = `${zIdx + 1} / ${totalImgs}`;
    znavPrev.disabled    = zIdx <= 0;
    znavNext.disabled    = zIdx >= totalImgs - 1;
  }

  window.openZoom = function(idx) {
    zIdx = idx;
    img.src = allImgs[zIdx];
    resetTransform(false);
    updateZoomNav();
    modal.classList.add('open');
  };

  function closeZoom() {
    modal.classList.remove('open');
    img.src = '';
  }

  function goZoomPage(delta) {
    const next = zIdx + delta;
    if (next < 0 || next >= totalImgs) return;
    zIdx = next;
    img.src = allImgs[zIdx];
    resetTransform(false);
    updateZoomNav();
    // メインのflipbookも同期
    if (pf) pf.flip(zIdx);
  }

  btnClose.addEventListener('click', closeZoom);
  btnIn.addEventListener('click',    () => { zScale = Math.min(5, zScale * 1.4); clampPan(); applyTransform(true); });
  btnOut.addEventListener('click',   () => { zScale = Math.max(0.5, zScale / 1.4); clampPan(); applyTransform(true); });
  znavPrev.addEventListener('click', () => goZoomPage(-1));
  znavNext.addEventListener('click', () => goZoomPage(+1));

  // キーボード対応（モーダル表示中）
  document.addEventListener('keydown', e => {
    if (!modal.classList.contains('open')) return;
    if (e.key === 'Escape')      closeZoom();
    if (e.key === 'ArrowRight')  goZoomPage(+1);
    if (e.key === 'ArrowLeft')   goZoomPage(-1);
  });

  // ── タッチイベント（ピンチ拡大・パン・ダブルタップ）──
  stage.addEventListener('touchstart', e => {
    if (e.touches.length === 2) {
      e.preventDefault();
      lastDist  = getTouchDist(e.touches);
      pinchMidX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
      pinchMidY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
      dragging  = false;
    } else if (e.touches.length === 1) {
      dragging = true;
      dragSX   = e.touches[0].clientX - zTx;
      dragSY   = e.touches[0].clientY - zTy;

      // ダブルタップ判定
      const now = Date.now();
      if (now - lastTapTime < 280) {
        if (zScale > 1.05) {
          resetTransform(true);
        } else {
          zScale = 2.5;
          applyTransform(true);
        }
        lastTapTime = 0;
      } else {
        lastTapTime = now;
      }
    }
  }, { passive: false });

  stage.addEventListener('touchmove', e => {
    e.preventDefault();
    if (e.touches.length === 2) {
      const dist  = getTouchDist(e.touches);
      const midX  = (e.touches[0].clientX + e.touches[1].clientX) / 2;
      const midY  = (e.touches[0].clientY + e.touches[1].clientY) / 2;

      zScale = Math.max(0.5, Math.min(5, zScale * (dist / lastDist)));
      zTx   += midX - pinchMidX;
      zTy   += midY - pinchMidY;

      lastDist  = dist;
      pinchMidX = midX;
      pinchMidY = midY;

      clampPan();
      applyTransform(false);
    } else if (e.touches.length === 1 && dragging && zScale > 1.05) {
      zTx = e.touches[0].clientX - dragSX;
      zTy = e.touches[0].clientY - dragSY;
      clampPan();
      applyTransform(false);
    }
  }, { passive: false });

  stage.addEventListener('touchend', e => {
    if (e.touches.length === 0) {
      dragging = false;
      if (zScale < 1) { zScale = 1; zTx = 0; zTy = 0; applyTransform(true); }
    }
  });

  // モーダル外タップで閉じない（誤操作防止のため閉じるボタンのみ）
})();

/* ═══════════════════════════════════════
   実行パイプライン
═══════════════════════════════════════ */
async function run(src) {
  try {
    const result = await renderPDF(src);  // { imgs, spreadW, spreadH, cssFactor }
    await buildViewer(result);
  } catch (err) {
    $('loading').style.display = 'none';
    $('err-box').style.display = 'block';
    $('err-msg').textContent   = 'エラー: ' + err.message;
    console.error(err);
  }
}

// 自動読み込み（XHR経由でSafari file://制限を回避）
(async () => {
  try {
    // 日本語ファイル名を安全にエンコードして絶対URLを構築
    const encodedName = PDF_NAME.replace(/[^\x00-\x7F()]/g, c => encodeURIComponent(c));
    const absUrl = new URL(encodedName, location.href).href;

    const buffer = await new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open('GET', absUrl, true);
      xhr.responseType = 'arraybuffer';
      xhr.onload = function () {
        if ((this.status === 0 || this.status === 200) && this.response && this.response.byteLength > 100) {
          resolve(this.response);
        } else {
          reject(new Error('file load failed: status=' + this.status));
        }
      };
      xhr.onerror = () => reject(new Error('XHR network error'));
      xhr.send();
    });

    await run(buffer);
  } catch (err) {
    console.warn('Auto-load failed:', err.message);
    $('loading').style.display = 'none';
    $('err-box').style.display  = 'block';
    $('err-msg').innerHTML =
      'PDFを自動読み込みできませんでした。<br>' +
      '下のボタンから <strong>社内報（創刊号A4）.pdf</strong> を選択してください。';
  }
})();

// 手動選択フォールバック
$('file-in').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file) return;
  $('err-box').style.display = 'none';
  $('loading').style.display = 'block';
  lMsg.textContent = 'ファイルを読み込んでいます...';
  pbar.style.width = '0%';
  run(await file.arrayBuffer());
});
</script>
